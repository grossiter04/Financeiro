name: Alertas de preço

on:
  schedule:
    # Horários em America/Sao_Paulo (BRT). Minutos fora de :00 reduzem atraso do GitHub.
    - cron: "7 10 * * 1-5"
      timezone: America/Sao_Paulo
    - cron: "7 13 * * 1-5"
      timezone: America/Sao_Paulo
    - cron: "7 16 * * 1-5"
      timezone: America/Sao_Paulo
  workflow_dispatch:
    inputs:
      test_email:
        description: "Enviar e-mail de teste (valida SMTP)"
        type: boolean
        default: false
      force:
        description: "Forçar reenvio (ignora anti-spam do dia)"
        type: boolean
        default: true

concurrency:
  group: alertas-preco
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar deps
        run: pip install -r requirements.txt

      - name: Restaurar state (anti-spam)
        uses: actions/cache/restore@v4
        with:
          path: alertas/state.json
          key: alertas-state-v2-${{ github.run_id }}
          restore-keys: |
            alertas-state-v2-
            alertas-state-

      - name: Checar e avisar
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            EXTRA="--force"
          fi
          python -m calculadora.alertas_cli $EXTRA

      - name: E-mail de teste (só se marcado no Run workflow)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email == true }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m calculadora.alertas_cli --test-email

      - name: Salvar state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alertas/state.json
          key: alertas-state-v2-${{ github.run_id }}

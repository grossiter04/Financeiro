name: Alertas de preço

on:
  schedule:
    # A cada 20 min no pregão (lista grande ~30 tickers)
    - cron: "*/20 13-20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: alertas-preco
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar deps
        run: pip install -r requirements.txt

      - name: Restaurar state (anti-spam)
        uses: actions/cache/restore@v4
        with:
          path: alertas/state.json
          key: alertas-state-${{ github.run_id }}
          restore-keys: |
            alertas-state-

      - name: Checar e avisar
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m calculadora.alertas_cli

      - name: Salvar state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alertas/state.json
          key: alertas-state-${{ github.run_id }}
